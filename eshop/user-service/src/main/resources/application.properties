spring.application.name=user-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5434/userdb
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=super-secret-key-for-eshop-fruits-vegetables-min-32bytes-987654321
# Token lifetime in milliseconds (24h)
jwt.expiration-ms=86400000

app.user-service.base-url=http://localhost:8082